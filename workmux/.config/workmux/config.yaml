nerdfont: true

post_create:
  - rm -rf vendor && ln -s ../../wearedev/vendor vendor
  - git ls-files -z vendor/ | xargs -0 git update-index --skip-worktree
  - grep -qxF vendor "$(git rev-parse --git-common-dir)/info/exclude" || echo vendor >> "$(git rev-parse --git-common-dir)/info/exclude"

agent: claude
base_branch: master
mode: session
theme: phosphor-arcade

panes:
  - command: vim
  - command: <agent>
    focus: true
    split: horizontal
  - command: lg
    split: vertical
