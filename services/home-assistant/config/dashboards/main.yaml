      name: Mode
      icon: mdi:tune-variant
      features:
      - type: select-options
      features_position: bottom
      grid_options:
        columns: 6
    - type: markdown
      content: |-
        {%- set D='binary_sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_dispatching' -%}
        {%- set soc = states('sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state_of_charge') | float(0) -%}
        {%- set batt = 82 -%}{#- 2021 Model 3 LR: ~78 kWh usable, ~82 kWh from the wall incl. charging losses (measured) -#}{%- set _ = 0 -%}
        {%- set goal = states('number.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_charge_target') | float(80) -%}
        {%- set c = namespace(k=0, h=0) -%}
        {%- for x in (state_attr(D,'completed_dispatches') or [])[-8:] -%}
        {%- set d = (as_datetime(x.end|string) - as_datetime(x.start|string)).total_seconds() / 3600 -%}
        {%- if d > 0 -%}{%- set c.k = c.k + (x.charge_in_kwh|float(0))|abs -%}{%- set c.h = c.h + d -%}{%- endif -%}
        {%- endfor -%}
        {%- set kw = (c.k / c.h) if c.h > 0 else 2.4 -%}
        {%- set pct = kw / batt * 100 -%}
        {%- set p = namespace(h=0, end=none, v=soc, ready=none) -%}
        {%- for x in (state_attr(D,'planned_dispatches') or []) | sort(attribute='start') -%}
        {%- set e = as_datetime(x.end|string) -%}
        {%- if e > now() -%}
        {%- set s = [as_datetime(x.start|string), now()] | max -%}
        {%- set d = (e - s).total_seconds() / 3600 -%}
        {%- if p.ready is none and p.v < goal and p.v + d * pct >= goal -%}{%- set p.ready = s + timedelta(hours=(goal - p.v) / pct) -%}{%- endif -%}
        {%- set p.h = p.h + d -%}{%- set p.v = [p.v + d * pct, 100] | min -%}{%- set p.end = e -%}
        {%- endif -%}
        {%- endfor -%}
        {%- set need = ([goal - soc, 0] | max) / pct -%}
        {%- set rem = need - p.h -%}
        {%- if p.ready is none and rem > 0 -%}
        {%- set base = [now(), p.end or now()] | max -%}
        {%- set b = base.replace(hour=23, minute=30, second=0, microsecond=0) -%}
        {%- if b < base -%}{%- set b = b + timedelta(days=1) -%}{%- endif -%}
        {%- set nights = (rem / 6) | round(0, 'ceil') | int -%}
        {%- set p.ready = b + timedelta(days=nights - 1, hours=rem - 6 * (nights - 1)) -%}
        {%- endif -%}
        {%- macro dur(hrs) -%}{{ hrs | int }} h {{ ((hrs * 60) % 60) | round(0) | int }} min{%- endmacro -%}
        {%- macro when(t) -%}{{ t.strftime('%a %H:%M') if t.date() != now().date() else 'today ' ~ t.strftime('%H:%M') }}{%- endmacro -%}
        | Battery **{{ soc | round(0) | int }}%** | charging at **{{ kw | round(1) }} kW** · {{ pct | round(1) }}%/h |
        |:--|--:|
        | Current plan{{ ' ends ' ~ when(p.end) if p.end else '' }} | {{ ('**≈' ~ (p.v | round(0) | int) ~ '%**') if p.end else 'no slots planned' }} |
        {% if soc >= goal -%}
        | To reach {{ goal | int }}% | **already there** |
        {%- else -%}
        | Charging needed to reach {{ goal | int }}% | **{{ dur(need) }}** |
        | Bump charge now, {{ goal | int }}% at | **{{ when(now() + timedelta(hours=need)) }}** · ≈£{{ '%.2f' | format(need * kw * 0.3612) }} at peak |
        | Off-peak only, {{ goal | int }}% by | **≈{{ when(p.ready) }}** · ≈£{{ '%.2f' | format(need * kw * 0.066) }} |
        {%- endif %}
        {%- set f = state_attr('sensor.car_charge_forecast','forecast') or {} %}
        {%- macro w(iso) -%}{%- if iso -%}{%- set t = as_datetime(iso) | as_local -%}{{ t.strftime('%a %H:%M') if t.date() != now().date() else 'today ' ~ t.strftime('%H:%M') }}{%- else -%}not within 3 days{%- endif -%}{%- endmacro %}
        {%- if is_state('input_boolean.smart_car_charge','on') %}
        | With Smart car charge ({{ states('input_select.smart_car_charge_mode') | lower }}), {{ goal | int }}% by | **≈{{ w(f.get('expected_ready')) }}** · guaranteed {{ w(f.get('guaranteed_ready')) }} |
        {%- if is_state('input_select.smart_car_charge_mode','Warmest house') %}
        | Cheap hours aimed at (coldest) | {{ state_attr('sensor.car_charge_cold_hours','summary') or '…' }} |
        {%- endif %}
        {%- endif %}
        {%- if f.get('deadline') %}
        | Must be ready by {{ w(f.get('deadline')) }} | {% if f.get('on_track') %}✅ **on track** (≈{{ f.get('battery_at_deadline_guaranteed') | int }}% guaranteed){% elif is_state('input_boolean.car_deadline_bumping','on') %}⚡ **bump charging now** to make it{% else %}⚠️ **short {{ f.get('short_hours') }} h** · will bump at peak if Octopus doesn't help (≈£{{ '%.2f' | format(f.get('short_cost_at_peak')) }}){% endif %} |
        {%- endif %}

        <sub>Off-peak estimate uses the current plan, then full 23:30–05:30 windows. Rate is the average of the last 8 charging slots. Guaranteed counts planned Octopus slots and night bumps; ≈ also assumes Octopus fills the daytime hours Smart car charge pushes it into.</sub>
      grid_options:
        columns: full
