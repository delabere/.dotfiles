# Managed in the dotfiles repo (services/home-assistant/config). Edit here, then build-brain.
# Main dashboard (sidebar: Main). YAML mode: edit here, not in the UI.
views:
- title: Home
  path: home
  type: sections
  max_columns: 4
  badges:
  - type: entity
    entity: weather.forecast_home
    show_name: false
    show_state: true
  - type: entity
    entity: person.jack
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: person.laire
    show_name: true
    show_state: true
    show_icon: true
  - type: entity
    entity: sensor.electricity_price
    name: Electricity
    show_name: true
    icon: mdi:flash
  - type: entity
    entity: binary_sensor.octopus_energy_electricity_23j0307021_1200041244369_off_peak
    name: Off-peak
    show_name: true
    icon: mdi:sleep
  - type: entity
    entity: sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state
    name: Peak-rate bump
    icon: mdi:alert-circle
    color: red
    show_name: true
    show_state: false
    show_icon: true
    tap_action:
      action: navigate
      navigation_path: /dashboard-lights/car
    visibility:
    - condition: state
      entity: sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state
      state: BOOSTING
    - condition: state
      entity: binary_sensor.octopus_energy_electricity_23j0307021_1200041244369_off_peak
      state: 'off'
