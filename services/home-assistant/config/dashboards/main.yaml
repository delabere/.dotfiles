    - type: custom:apexcharts-card
      header:
        show: true
        title: Downstairs heating
        show_states: true
        colorize_states: false
      graph_span: 24h
      update_interval: 5min
      apex_config:
        chart:
          height: 280
        legend:
          show: true
          position: bottom
        tooltip:
          x:
            format: HH:mm
        grid:
          borderColor: rgba(127,127,127,0.2)
        xaxis:
          labels:
            datetimeFormatter:
              hour: HH:mm
      yaxis:
      - min: '|-1|'
        max: '|+0.5|'
        decimals: 0
        apex_config:
          tickAmount: 4
        id: temp
      - id: strip
        show: false
        min: 0
        max: 12
      series:
      - entity: sensor.tado_smart_thermostat_ru2093884160_current_temperature
        name: 'Off'
        type: area
        curve: straight
        color: '#3b4048'
        opacity: 0.9
        stroke_width: 2
        data_generator: |2-

          const T='sensor.tado_smart_thermostat_ru2093884160_current_temperature', C='climate.tado_smart_thermostat_ru2093884160', S='switch.shellyplus1pm_e465b8930098_switch_0';
          const cache = (window.__heatHist = window.__heatHist || {});
          const key = Math.floor(start.getTime()/60000) + ':' + Math.floor(end.getTime()/60000);
          if (!cache[key]) { for (const k of Object.keys(cache)) delete cache[k]; cache[key] = hass.callWS({type:'history/history_during_period', start_time:start.toISOString(), end_time:end.toISOString(), entity_ids:[T,C,S], minimal_response:false, no_attributes:false, significant_changes_only:false}); }
          const hist = await cache[key];
          const ts = x => ((x.lu ?? x.lc) * 1000);
          const steps = (arr, f) => (arr||[]).map(x => [ts(x), f(x)]).sort((a,b)=>a[0]-b[0]);
          const temp = steps(hist[T], x => parseFloat(x.s)).filter(p => !isNaN(p[1]));
          const gas = steps(hist[C], x => x.s === 'heat' && (x.a||{}).hvac_action === 'heating');
          const ufh = steps(hist[S], x => x.s === 'on');
          const at = (arr, t, i) => { while (i.v + 1 < arr.length && arr[i.v+1][0] <= t) i.v++; return arr.length && arr[i.v][0] <= t ? arr[i.v][1] : null; };
          const out = []; const it={v:0}, ig={v:0}, iu={v:0};
          const stop = Math.min(end.getTime(), Date.now());
          for (let t = start.getTime(); t <= stop; t += 5*60000) {
            const v = at(temp, t, it); if (v === null) continue;
            const g = !!at(gas, t, ig), u = !!at(ufh, t, iu);
            const show = "base" === 'base' || ("base" === 'gas' && g && !u) || ("base" === 'ufh' && u && !g) || ("base" === 'both' && g && u);
            out.push([t, show ? v : null]);
          }
          return out;
        show:
          in_header: false
          legend_value: false
        yaxis_id: temp
