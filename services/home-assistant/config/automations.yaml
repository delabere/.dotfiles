    in_night_window: '{{ now().strftime(''%H:%M'') >= night_window_start or now().strftime(''%H:%M'') < night_window_end }}'
  mode: queued
  max: 10
  trace:
    stored_traces: 100
- id: claude_car_deadline_override
  alias: Car must-be-ready override
  description: 'Hard deadline for the car (input_datetime.car_must_be_ready_by, active while input_boolean.car_must_be_ready is on). Uses sensor.car_charge_forecast: if the guaranteed charging (planned Octopus slots + Smart car charge night bumps) won''t reach the Octopus target 30 minutes before the deadline, it bump-charges at peak rate, starting only at the last safe moment (when uncovered hours left = shortfall + 1 h) so Octopus can still schedule cheap slots first. Stops as soon as the guaranteed forecast is back on track or the deadline passes. Only stops bumps it started. Logged to car-charge-log.csv.'
  triggers:
  - trigger: state
    entity_id: sensor.car_charge_forecast
  - trigger: state
    entity_id: input_boolean.car_must_be_ready
  - trigger: state
    entity_id: input_datetime.car_must_be_ready_by
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ bump_now and plugged and not is_state(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state'',''BOOSTING'') }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_bump_charge
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.car_deadline_bumping
      - delay:
          seconds: 20
      - action: notify.send_message
        target:
          entity_id: notify.car_charge_log
        data:
          message: '{{ now().strftime(''%Y-%m-%d %H:%M'') }},deadline bump on,short {{ f.short_hours }}h for {{ as_datetime(f.deadline).strftime(''%a %H:%M'') }},{{ states(''select.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_target_time'') }},{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_charge_cap_hours'') }},{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state_of_charge'') }},{{ states(''number.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_charge_target'') }},{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state'') }},{{ states(''switch.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_bump_charge'') }}'
      - action: notify.mobile_app_pixel_10_pro
        data:
          title: Bump charging for your deadline
          message: Cheap charging won't get the car to {{ f.target | int }}% by {{ as_datetime(f.deadline).strftime('%a %H:%M') }}, so it's bump charging now (about {{ f.short_hours }} h, ≈£{{ '%.2f' | format(f.short_cost_at_peak) }} at peak).
    - conditions:
      - condition: template
        value_template: '{{ is_state(''input_boolean.car_deadline_bumping'',''on'') and not bump_now }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(''switch.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_bump_charge'',''on'') and not is_state(''input_boolean.smart_car_charge_bumping'',''on'') }}'
        then:
        - action: switch.turn_off
          target:
            entity_id: switch.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_bump_charge
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.car_deadline_bumping
      - delay:
          seconds: 5
      - action: notify.send_message
        target:
          entity_id: notify.car_charge_log
        data:
          message: '{{ now().strftime(''%Y-%m-%d %H:%M'') }},deadline bump off,{{ ''back on track'' if f.get(''on_track'') else ''deadline passed or cleared'' }},{{ states(''select.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_target_time'') }},{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_charge_cap_hours'') }},{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state_of_charge'') }},{{ states(''number.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_charge_target'') }},{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state'') }},{{ states(''switch.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_bump_charge'') }}'
  variables:
    f: '{{ state_attr(''sensor.car_charge_forecast'',''forecast'') or {} }}'
    bump_now: '{{ f.get(''bump_now'', false) }}'
    plugged: '{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state'') in [''SMART_CONTROL_IN_PROGRESS'',''SMART_CONTROL_CAPABLE'',''BOOSTING''] }}'
  mode: queued
  max: 5
- id: claude_car_morning_status
  alias: Car morning status
  description: '07:00: tells Jack the car''s battery if it is below the Octopus target, or if a must-be-ready deadline is set (to confirm it is on track). Quiet otherwise, and quiet when the car is unplugged or away.'
  triggers:
  - trigger: time
    at: 07:00:00
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state_of_charge'') | float(0) < states(''number.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_charge_target'') | float(80) or is_state(''input_boolean.car_must_be_ready'',''on'') }}'
  - condition: template
    value_template: '{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state'') not in [''SMART_CONTROL_NOT_AVAILABLE'',''TEST_CHARGE_NOT_AVAILABLE''] }}'
  actions:
  - action: notify.mobile_app_pixel_10_pro
    data:
      title: Car this morning
      message: |-
        {%- set f = state_attr('sensor.car_charge_forecast','forecast') or {} -%}{%- set soc = states('sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state_of_charge') | float(0) -%}{%- set goal = states('number.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_charge_target') | float(80) -%}{%- set pct = f.get('pct_per_hour', 2.9) | float(2.9) -%}
        {%- if soc < goal -%}Car at {{ soc | round(0) | int }}% · {{ ((goal - soc) / pct) | round(1) }} h of charging short of {{ goal | int }}%.{% if f.get('expected_ready') %} Expected at {{ goal | int }}% by {{ (as_datetime(f.get('expected_ready')) | as_local).strftime('%a %H:%M') }}.{% endif %}
        {%- else -%}Car at {{ soc | round(0) | int }}% ✅ ready.{%- endif -%}
        {%- if f.get('deadline') %} Must be ready by {{ (as_datetime(f.get('deadline')) | as_local).strftime('%a %H:%M') }}: {{ 'on track ✅' if f.get('on_track') else 'short, will bump at peak if needed ⚠️' }}.{% endif %}
  mode: single
