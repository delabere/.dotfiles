    lead_hours: 2
    day_start_hour: 12
    last_roll_hour: 21
    enabled: '{{ is_state(''input_boolean.smart_car_charge'',''on'') }}'
    plugged: '{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state'') in [''SMART_CONTROL_IN_PROGRESS'',''SMART_CONTROL_CAPABLE'',''BOOSTING''] }}'
    needs_charge: '{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_state_of_charge'') | float(100) < states(''number.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_charge_target'') | float(80) }}'
    cap_used: '{{ states(''sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_charge_cap_hours'') | float(0) }}'
    day_phase: '{{ day_start_hour <= now().hour <= (last_roll_hour if mode == ''Fastest charge'' else 22) }}'
    normal_rb: '{{ states(''input_text.smart_car_charge_normal_ready_by'') if states(''input_text.smart_car_charge_normal_ready_by'') | regex_match(''^[0-2][0-9]:[03]0$'') else ''10:00'' }}'
    off_peak: '{{ is_state(''binary_sensor.octopus_energy_electricity_23j0307021_1200041244369_off_peak'',''on'') }}'
    smart_slot_now: '{{ is_state(''binary_sensor.octopus_energy_00000000_0002_4000_8020_000000076b06_intelligent_dispatching'',''on'') }}'
    night_window_start: '23:30'
